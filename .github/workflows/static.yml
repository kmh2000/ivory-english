# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate published lessons
        run: python scripts/check_text.py
      - name: Restore original verbal page cache
        id: verbalcache
        uses: actions/cache@v4
        with:
          path: |
            dist/verbal/pages
            dist/verbal/reader-manifest.json
          key: ivory-english-verbal-pages-92-v1
      - name: Download last verified verbal page archive
        if: steps.verbalcache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: pages-44881531024-1
          run-id: 44881531024
          github-token: ${{ github.token }}
          path: ./tmp-verbal-pages
      - name: Restore original source pages
        if: steps.verbalcache.outputs.cache-hit != 'true'
        run: python scripts/restore_verbal_pages.py tmp-verbal-pages/artifact.tar
      - name: Verify original source pages
        run: |
          test -s dist/verbal/reader-manifest.json
          test "$(find dist/verbal/pages -name '*.webp' | wc -l)" -eq 92
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          # Publish index.html from the actual site directory
          path: './dist'
      - name: Wait for GitHub Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 20); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].name' | grep -Fxq "$ARTIFACT_NAME"; then
              sleep 10
              exit 0
            fi
            sleep 3
          done
          echo "Pages artifact not indexed yet" >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
